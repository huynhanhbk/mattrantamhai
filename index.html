<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Initialize theme early to avoid FOUC
      (function () {
        try {
          var stored = localStorage.getItem('tamhai_theme');
          var theme = stored === 'light' ? 'light' : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();

      // Compatibility shim: Prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function () {
        try {
          if (typeof window !== 'undefined' && typeof window.fetch === 'function') {
            var _origFetch = window.fetch.bind(window);
            var _currentFetch = _origFetch;
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return _currentFetch;
              },
              set: function (fn) {
                _currentFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // Fallback if property is not configurable
        }
      })();
    </script>
    <title>Hội Thi Ban Công Tác Mặt Trận Với Chuyển Đổi Số</title>
